name: ci 
on:
  push:
    branches:
      - master 
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache
      - run: pip install mkdocs-material
      - run: pip install pillow cairosvg
      - run: |
          # Create temporary backup of source files
          mkdir -p /tmp/mkdocs-backup
          cp -r docs/ mkdocs.yml /tmp/mkdocs-backup/
          
          # Build to temporary directory first
          mkdocs build --site-dir /tmp/mkdocs-build
          
          # Clear current directory (keep .git and source in backup)
          find . -maxdepth 1 -not -name '.git' -not -name '.' -not -name '..' -exec rm -rf {} \;
          
          # Copy built files to current directory
          cp -r /tmp/mkdocs-build/* .
          
          # Restore essential files
          cp /tmp/mkdocs-backup/mkdocs.yml .
          cp -r /tmp/mkdocs-backup/docs .
          
          # Configure git and deploy
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add .
          git commit -m "Deploy documentation to root directory" || exit 0
          git push origin HEAD:gh-pages --force